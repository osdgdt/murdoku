# Publishes the site to GitHub Pages only after the whole CI (lint, format,
# tests, size check, e2e) has passed on main.
#
# One-time switch (Settings → Pages → Build and deployment → Source):
# choose "GitHub Actions". Until then Pages keeps publishing straight from the
# branch, without waiting for any check, and this workflow's deploy job fails.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Build and deploy are separate jobs (GitHub's own pattern): deploy-pages looks
  # the artifact up right after it is uploaded, and when both ran in the same
  # job that lookup sometimes came back empty ("Found 0 artifact(s)"), so a
  # merge was checked but never published.
  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only what the site needs at runtime: not test/, tools/, node_modules/.
      - name: Collect site files
        run: |
          mkdir _site
          cp *.html manifest.webmanifest sw.js robots.txt sitemap.xml _site/
          cp -r fonts icons src styles examples _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
