<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#8a1f2d" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="robots" content="noindex" />
  <title>Stampa Murdoku</title>
  <link rel="preload" href="fonts/inter-normal-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/print.css" />
</head>
<body>
  <div class="no-print field-row" style="padding:1.25rem 1.5rem; justify-content:center">
    <button class="primary" onclick="window.print()">🖨 Stampa</button>
    <a href="javascript:history.back()">← Torna indietro</a>
  </div>
  <div id="print-root"></div>

  <script type="module" src="src/i18n/i18n.js"></script>
  <script type="module">
    import { t } from "./src/i18n/i18n.js";
    import * as store from "./src/storage/puzzleStore.js";
    import { renderPrintView } from "./src/print/printView.js";

    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const puzzle = id ? store.get(id) : null;
    const root = document.getElementById("print-root");
    if (!puzzle) {
      const p = document.createElement("p");
      p.style.padding = "1rem";
      p.textContent = t("Puzzle non trovato.");
      root.appendChild(p);
    } else {
      renderPrintView(root, puzzle);
    }
  </script>
</body>
</html>
