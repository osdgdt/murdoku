# TEMPORARY (this branch only): checks that newer versions of the Pages actions resolve and run, without deploying.
name: zz-actions-check
on:
  push:
    branches: [ccr-ea41143f-1dn8ej]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: mkdir _site && cp index.html _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: check-v5
  build-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: mkdir _site && cp index.html _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: check-v4
  deploy-setup-only:
    runs-on: ubuntu-latest
    steps:
      # never runs (if: false); the job still has to download the action, which proves the tag exists
      - if: false
        uses: actions/deploy-pages@v5
      - run: echo "deploy-pages@v5 downloaded"
