<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#b5493a" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#2a2230" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="robots" content="noindex" />
  <title>Editor campagne — Murdoku</title>
  <link rel="preload" href="fonts/nunito-variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/landing.css" />
  <link rel="stylesheet" href="styles/editor.css" />
  <link rel="stylesheet" href="styles/skin-paper.css" />
  <script>
    try {
      var t = localStorage.getItem("murdoku:theme");
      if (t === "dark" || (t !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">🔎 Murdoku</a>
    <h2 style="margin:0">Editor campagne</h2>
    <div class="topbar-right" id="auth-bar" style="display:flex;align-items:center;gap:0.6rem">
      <button type="button" data-lang-toggle class="theme-toggle" data-no-i18n>EN</button>
      <button type="button" data-theme-toggle class="theme-toggle" title="Passa al tema scuro">🌙</button>
    </div>
  </header>
  <main>

  <div id="gate" class="hero"></div>

  <div id="app" class="hidden" style="max-width:900px;margin:1.5rem auto;padding:0 1.5rem">
    <div id="list-view">
      <div class="saved-list-header">
        <h2>Le tue campagne</h2>
        <button id="new-campaign-btn" class="primary">+ Nuova campagna</button>
      </div>
      <div class="panel"><div id="campaign-list"></div></div>
    </div>

    <div id="detail-view" class="hidden">
      <p><a href="campaign-editor.html">← Tutte le campagne</a></p>
      <div class="panel">
        <div class="field-row">
          <label for="campaign-title">Titolo</label>
          <input id="campaign-title" type="text" placeholder="Titolo della campagna" style="flex:1" />
        </div>
        <div class="field-row">
          <label for="campaign-description">Descrizione</label>
          <textarea id="campaign-description" rows="2" placeholder="Di cosa parla questa campagna" style="flex:1"></textarea>
        </div>
        <p id="detail-status" class="muted"></p>
      </div>

      <div class="panel" style="margin-top:1rem">
        <h3>Casi (in ordine)</h3>
        <div id="case-list"></div>
        <div class="field-row" style="margin-top:0.8rem">
          <label for="add-case-url">Nuovo caso</label>
          <input id="add-case-url" type="text" placeholder="URL del file .murdoku.json (es. examples/tutorial.it.murdoku.json)" style="flex:1" />
          <button id="add-case-btn">Aggiungi</button>
        </div>
        <p id="add-case-status" class="muted"></p>
      </div>
    </div>
  </div>

  
  </main>

  <script type="module" src="src/i18n/i18n.js"></script>
  <script type="module" src="src/util/pwa.js"></script>
  <script type="module" src="src/skin/paper/chrome.js"></script>
  <script type="module" src="src/util/errorReport.js"></script>
  <script type="module" src="src/campaign/campaignEditorApp.js"></script>
</body>
</html>
