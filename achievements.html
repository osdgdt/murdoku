<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#b5493a" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#2a2230" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="description" content="I tuoi traguardi e il tuo storico di risoluzioni. / Your achievements and solve history." />
  <link rel="canonical" href="https://osdgdt.github.io/murdoku/achievements.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Murdoku" />
  <meta property="og:title" content="Traguardi — Murdoku / Achievements — Murdoku" />
  <meta property="og:description" content="I tuoi traguardi e il tuo storico di risoluzioni. / Your achievements and solve history." />
  <meta property="og:url" content="https://osdgdt.github.io/murdoku/achievements.html" />
  <meta property="og:image" content="https://osdgdt.github.io/murdoku/icons/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Traguardi — Murdoku</title>
  <link rel="preload" href="fonts/nunito-variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/landing.css" />
  <link rel="stylesheet" href="styles/achievements.css" />
  <link rel="stylesheet" href="styles/skin-paper.css" />
  <script>
    try {
      var t = localStorage.getItem("murdoku:theme");
      if (t === "dark" || (t !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">🔎 Murdoku</a>
    <nav class="topbar-nav">
      <button type="button" data-lang-toggle class="theme-toggle" data-no-i18n>EN</button>
      <button type="button" data-theme-toggle class="theme-toggle" title="Passa al tema scuro">🌙</button>
      <div id="auth-bar"></div>
      <a href="index.html">← Torna alla home</a>
    </nav>
  </header>
  <main>

  <div class="hero">
    <span class="eyebrow">Il tuo taccuino</span>
    <h1>Traguardi</h1>
    <div class="hero-divider"></div>
    <p class="lede">Ogni traguardo è personale: nessun confronto con altri giocatori.</p>
    <p id="sync-status" class="muted"></p>
  </div>

  <div id="achievements-root"></div>

  <p class="footer-note">Murdoku — restano solo su questo dispositivo, a meno che tu non scelga di accedere con Google per sincronizzarli su più dispositivi.</p>

  
  <p class="footer-note"><a href="privacy.html">Privacy e cancellazione dati</a></p>
  </main>

  <script type="module" src="src/i18n/i18n.js"></script>
  <script type="module" src="src/util/pwa.js"></script>
  <script type="module" src="src/skin/paper/chrome.js"></script>
  <script type="module" src="src/util/errorReport.js"></script>
  <script type="module">
    import { t } from "./src/i18n/i18n.js";
    import { wireThemeToggle } from "./src/util/theme.js";
    import { renderAchievementsPage } from "./src/achievements/achievementsView.js";
    import { onAuthChange, signIn, signOutUser } from "./src/auth/googleAuth.js";
    import { syncAchievements } from "./src/storage/achievementsSyncStore.js";
    wireThemeToggle();

    const root = document.getElementById("achievements-root");
    const authBar = document.getElementById("auth-bar");
    const syncStatus = document.getElementById("sync-status");

    function renderAuthBar(user) {
      authBar.innerHTML = "";
      if (user) {
        const emailSpan = document.createElement("span");
        emailSpan.className = "muted";
        emailSpan.textContent = user.email;
        const signOutBtn = document.createElement("button");
        signOutBtn.type = "button";
        signOutBtn.textContent = t("Esci");
        signOutBtn.onclick = () => signOutUser();
        authBar.append(emailSpan, signOutBtn);
      } else {
        const signInBtn = document.createElement("button");
        signInBtn.type = "button";
        signInBtn.textContent = t("Accedi con Google");
        signInBtn.onclick = () => signIn().catch((err) => { syncStatus.textContent = err.message; });
        authBar.append(signInBtn);
      }
    }

    // Not a gate — the page always renders local achievements regardless of
    // sign-in state; signing in only adds the pull-merge-push sync on top
    // (see achievementsSyncStore.js), safe to re-run every time this fires
    // (e.g. on every load while already signed in from a previous visit).
    onAuthChange(async (user) => {
      renderAuthBar(user);
      renderAchievementsPage(root);
      if (!user) {
        syncStatus.textContent = t("Salvati solo su questo dispositivo. Accedi con Google per sincronizzarli tra più dispositivi.");
        return;
      }
      syncStatus.textContent = t("Sincronizzazione in corso…");
      try {
        const newlyUnlocked = await syncAchievements(user.uid);
        syncStatus.textContent = newlyUnlocked.length > 0
          ? t("Sincronizzato con il tuo account Google. {found} da un altro dispositivo: {titles}.", {
              found: newlyUnlocked.length === 1 ? t("Nuovo traguardo trovato") : t("{count} nuovi traguardi trovati", { count: newlyUnlocked.length }),
              titles: newlyUnlocked.map((a) => a.title).join(", "),
            })
          : t("Sincronizzato con il tuo account Google.");
        renderAchievementsPage(root);
      } catch (err) {
        syncStatus.textContent = t("Impossibile sincronizzare: {message} (i traguardi restano salvati su questo dispositivo).", { message: err.message });
      }
    });
  </script>
</body>
</html>
