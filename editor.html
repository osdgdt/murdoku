<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#b5493a" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#2a2230" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="description" content="Crea il tuo caso Murdoku: mappa, personaggi, indizi, verifica dell&#x27;unicità. / Build your own Murdoku case: map, characters, clues, uniqueness check." />
  <link rel="canonical" href="https://osdgdt.github.io/murdoku/editor.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Murdoku" />
  <meta property="og:title" content="Murdoku Editor" />
  <meta property="og:description" content="Crea il tuo caso Murdoku: mappa, personaggi, indizi, verifica dell&#x27;unicità. / Build your own Murdoku case: map, characters, clues, uniqueness check." />
  <meta property="og:url" content="https://osdgdt.github.io/murdoku/editor.html" />
  <meta property="og:image" content="https://osdgdt.github.io/murdoku/icons/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Murdoku Editor</title>
  <link rel="preload" href="fonts/nunito-variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/editor.css" />
  <link rel="stylesheet" href="styles/skin-paper.css" />
  <script>
    try {
      var t = localStorage.getItem("murdoku:theme");
      if (t === "dark" || (t !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">🔎 Murdoku</a>
    <h1 class="visually-hidden">Murdoku Editor</h1>
    <div class="title-fields">
      <input id="puzzle-title" class="title-input" type="text" placeholder="Titolo del caso" aria-label="Titolo del caso" />
      <input id="puzzle-author" class="author-input" type="text" placeholder="Autore" aria-label="Autore" />
      <select id="puzzle-difficulty" class="difficulty-input" title="Difficoltà" aria-label="Difficoltà"></select>
    </div>
    <nav class="topbar-actions">
      <button type="button" data-lang-toggle class="theme-toggle" data-no-i18n>EN</button>
      <button type="button" data-theme-toggle class="theme-toggle" title="Passa al tema scuro">🌙</button>
      <button id="save-btn">💾 Salva</button>
      <button id="export-btn">⬇ Esporta</button>
      <button id="share-btn" title="Copia un link che contiene l'intero caso: chi lo apre può giocarlo subito">🔗 Condividi</button>
      <button type="button" onclick="document.getElementById('import-input').click()">⬆ Importa</button>
      <input id="import-input" type="file" accept=".json" class="hidden" />
      <button id="duplicate-btn" title="Duplica questo caso">📋 Duplica</button>
      <button id="print-btn">🖨 Stampa</button>
      <button id="play-btn" class="primary">▶ Gioca</button>
      <button id="delete-btn" class="danger" title="Elimina questo caso">🗑 Elimina</button>
    </nav>
  </header>
  <main>

  <div class="editor-toolstrip">
    <div class="tab-group">
      <button id="tab-map">🗺️ Mappa</button>
      <button id="tab-solution">🔑 Soluzione</button>
      <button id="tab-hints">💡 Suggerimenti</button>
    </div>
    <div class="tab-group">
      <button id="editor-undo-btn" title="Annulla" disabled>↶ Annulla</button>
      <button id="editor-redo-btn" title="Ripeti" disabled>↷ Ripeti</button>
    </div>
    <div class="tab-group">
      <button id="validate-btn">✓ Valida soluzione</button>
      <button id="unique-btn">? Verifica unicità</button>
      <button id="redundant-btn" title="Trova gli indizi che si possono togliere senza rendere il caso ambiguo">✂ Indizi superflui</button>
      <button id="estimate-btn" title="Stima la difficoltà dal numero di nodi esplorati dal solver">📊 Stima difficoltà</button>
      <button id="calc-solution-btn" title="Deduce la soluzione dagli indizi con una ricerca esaustiva, quando è unica, e la compila automaticamente nella scheda Soluzione">🧮 Calcola soluzione</button>
    </div>
    <span id="status" class="muted"></span>
  </div>

  <details class="dossier-panel">
    <summary>📖 Dossier del caso</summary>
    <div class="dossier-fields">
      <label for="puzzle-briefing">Testo introduttivo (mostrato al giocatore prima degli indizi)</label>
      <textarea id="puzzle-briefing" rows="3" placeholder="Es. La sera del 12 ottobre, il corpo di Lord Ashford viene trovato nella biblioteca..."></textarea>
      <label for="puzzle-resolution">Nota di chiusura (mostrata insieme alla rivelazione dell'assassino)</label>
      <textarea id="puzzle-resolution" rows="2" placeholder="Es. Con le prove raccolte, il caso è ufficialmente chiuso..."></textarea>
    </div>
  </details>

  <div class="editor-layout">
    <div id="left-panel" class="panel"></div>
    <div>
      <div id="board"></div>
      <div id="validation-panel" class="validation-panel"></div>
    </div>
    <div>
      <div id="right-panel-top" class="panel" style="margin-bottom:1rem"></div>
      <div id="right-panel-bottom" class="panel"></div>
    </div>
  </div>

  
  </main>

  <script type="module" src="src/i18n/i18n.js"></script>
  <script type="module" src="src/util/pwa.js"></script>
  <script type="module" src="src/skin/paper/chrome.js"></script>
  <script type="module" src="src/util/errorReport.js"></script>
  <script type="module" src="src/editor/editorApp.js"></script>
</body>
</html>
