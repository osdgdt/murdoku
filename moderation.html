<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https:; frame-src https://*.firebaseapp.com https://accounts.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="robots" content="noindex" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#b5493a" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#2a2230" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="description" content="Pagina riservata agli amministratori. / Administrators only." />
  <title>Moderazione — Murdoku</title>
  <link rel="preload" href="fonts/nunito-variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/landing.css" />
  <link rel="stylesheet" href="styles/editor.css" />
  <link rel="stylesheet" href="styles/player.css" />
  <link rel="stylesheet" href="styles/community.css" />
  <link rel="stylesheet" href="styles/skin-paper.css" />
  <link rel="stylesheet" href="styles/contrast.css" />
  <script>
    try {
      var t = localStorage.getItem("murdoku:theme");
      var more = window.matchMedia && (matchMedia("(prefers-contrast: more)").matches || matchMedia("(forced-colors: active)").matches);
      if (t === "contrast" || (t !== "light" && t !== "dark" && more)) document.documentElement.setAttribute("data-theme", "contrast");
      else if (t === "dark" || (t !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">🔎 Murdoku</a>
    <h1 class="player-title">Moderazione</h1>
    <div class="topbar-right">
      <span id="auth-bar" class="auth-bar"></span>
      <button type="button" data-lang-toggle class="theme-toggle" data-no-i18n>EN</button>
      <button type="button" data-theme-toggle class="theme-toggle" title="Passa al tema scuro">🌙</button>
      <nav><a href="community.html">Casi della community</a></nav>
    </div>
  </header>
  <main class="community">
    <noscript><p>Questa pagina ha bisogno di JavaScript.</p></noscript>
    <div id="moderation-app"></div>
  </main>

  <script type="module" src="src/i18n/i18n.js"></script>
  <script type="module" src="src/util/pwa.js"></script>
  <script type="module" src="src/skin/paper/chrome.js"></script>
  <script type="module" src="src/util/errorReport.js"></script>
  <script type="module" src="src/community/moderationApp.js"></script>
</body>
</html>
