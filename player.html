<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gioca a Murdoku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/landing.css" />
  <link rel="stylesheet" href="styles/editor.css" />
  <link rel="stylesheet" href="styles/player.css" />
  <script>
    try {
      if (localStorage.getItem("murdoku:theme") === "dark") document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {}
  </script>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="index.html">🔎 Murdoku</a>
    <h2 id="player-title" class="player-title"></h2>
    <div class="topbar-right">
      <span id="timer" class="timer">⏱ 0:00</span>
      <button type="button" data-theme-toggle class="theme-toggle" title="Passa al tema scuro">🌙</button>
      <nav><a href="index.html">Cambia caso</a></nav>
    </div>
  </div>

  <div id="puzzle-picker" class="picker-wrap"></div>

  <div id="game" class="hidden">
    <div class="game-toolstrip">
      <div id="player-toolbar" class="player-toolbar"></div>
      <div class="field-row">
        <button id="undo-btn">↶ Annulla</button>
        <button id="clear-btn" title="Tieni premuto per cancellare tutto">🧹 Pulisci tutto (tieni premuto)</button>
        <button id="hint-btn">💡 Suggerimento</button>
        <button id="submit-btn" class="primary">✓ Verifica soluzione</button>
      </div>
      <p id="notes-hint" class="muted">Clicca una casella per segnare/togliere una nota. Tieni premuto il mouse e trascinalo per segnarne più di una. Tieni premuto fermo su una casella per piazzarci il personaggio selezionato: le sue note esistenti verranno cancellate.</p>
      <div id="hint-panel"></div>
      <div id="result-panel"></div>
    </div>
    <div class="player-layout">
      <div id="board"></div>
      <div>
        <div id="briefing-panel" class="panel briefing-panel hidden"></div>
        <div id="clues-panel" class="panel"></div>
      </div>
    </div>
  </div>

  <script type="module" src="src/player/playerApp.js"></script>
</body>
</html>
